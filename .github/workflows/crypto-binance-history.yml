name: NBU Rate — Binance USDT historical archive
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbu-data-writer
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public spot daily candles (USDT only)
        id: history
        continue-on-error: true
        run: node scripts/fetch-binance-history.mjs
      - name: Commit archive
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/crypto-history/binance/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: Binance USDT historical archive'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report source failure
        if: steps.history.outcome != 'success'
        run: exit 1
