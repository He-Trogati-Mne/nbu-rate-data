name: NBU Rate — Full crypto archive backfill
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Import official archives; no API keys'
        type: choice
        options: ['all', 'kraken', 'binance']
        default: 'all'
permissions:
  contents: write
concurrency:
  group: nbu-data-writer
  cancel-in-progress: false
jobs:
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Kraken full USD archive (selected daily files)
        id: kraken
        if: inputs.source != 'binance'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 -u scripts/import-crypto-archives.py --kraken-remote
      - name: Binance full monthly USDT archives (resumable)
        id: binance
        if: inputs.source != 'kraken'
        continue-on-error: true
        timeout-minutes: 40
        run: python3 -u scripts/import-crypto-archives.py --binance-all
      - name: Coverage report and publish partial progress
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/crypto-history-coverage.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: full crypto archive backfill'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report source failures
        if: steps.kraken.outcome == 'failure' || steps.binance.outcome == 'failure'
        run: exit 1
