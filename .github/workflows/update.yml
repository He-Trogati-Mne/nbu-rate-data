name: NBU Rate — оновлення даних
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 'Додатковий прохід історії НБУ та криптовалют'
        type: boolean
        default: false
      stock_backfill:
        description: 'Розширене оновлення історії акцій'
        type: boolean
        default: false
      archive:
        description: 'Глибокий імпорт офіційних архівів криптовалют (лише вручну)'
        type: choice
        options: ['none', 'kraken', 'binance', 'all']
        default: 'none'
      publish:
        description: 'Зберегти дані у main (вимкніть для тесту)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: nbu-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Перевірка захисту історії
        run: |
          node scripts/update-all.mjs --self-test
          node scripts/bank-fallbacks.mjs --self-test
      - name: Встановлення Chromium
        timeout-minutes: 6
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Оновлення всіх джерел
        env:
          HISTORY: ${{ inputs.history && '1' || '0' }}
          NBU_ARCHIVE_IMPORT: ${{ inputs.archive || 'none' }}
          NBU_STOCK_BACKFILL: ${{ inputs.stock_backfill && '1' || '0' }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: |
          if [[ "$HISTORY" == 1 ]]; then
            node scripts/update-all.mjs --history
          else
            node scripts/update-all.mjs
          fi
      - name: Зберегти звіт як артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report
          path: |
            data/update-status.json
            data/bank-fallback-status.json
            data/bank-fetch-status.json
            data/stocks-status.json
          if-no-files-found: warn
          retention-days: 7
      - name: Публікація JSON
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'data/*.json' 'data/**/*.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: оновлення $(date -u +%FT%TZ)"
          git push origin HEAD:main
