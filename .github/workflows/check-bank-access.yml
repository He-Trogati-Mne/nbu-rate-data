name: "NBU Rate — діагностика доступу до банків"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: "Перевірка GitHub IP і довірених проксі"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Визначити вихідну IP-адресу GitHub Actions"
        shell: bash
        run: |
          echo "GitHub runner, вихідна IP (лише для діагностики):"
          curl --fail --silent --show-error --max-time 10 https://api.ipify.org || true
          echo

      - name: "Перевірити публічні сторінки офіційних банків"
        shell: bash
        env:
          BANK_PROXY_POOL: ${{ secrets.BANK_PROXY_POOL }}
        run: |
          set -uo pipefail

          # Один довірений HTTP(S)-proxy на рядок у BANK_PROXY_POOL.
          # У журнал потрапляє тільки номер проксі, без адреси чи пароля.
          proxy_list=()
          if [ -n "${BANK_PROXY_POOL:-}" ]; then
            while IFS= read -r proxy; do
              proxy="${proxy%$'\r'}"
              [ -z "$proxy" ] && continue
              proxy_list+=("$proxy")
              [ "${#proxy_list[@]}" -ge 3 ] && break
            done <<< "$BANK_PROXY_POOL"
          fi

          names=("Райффайзен" "Sense" "Південний" "Ідея" "А-Банк" "АСВІО" "ПУМБ (контроль)")
          urls=(
            "https://raiffeisen.ua/currency"
            "https://sensebank.ua/currency-exchange"
            "https://bank.com.ua/currency-metals-rates"
            "https://ideabank.ua/uk"
            "https://a-bank.com.ua/"
            "https://www.asviobank.ua/"
            "https://about.pumb.ua/"
          )

          {
            echo '## Діагностика доступу до офіційних сайтів банків'
            echo
            echo 'HTTP 200 означає лише доступ до сторінки, **не підтверджує коректність валютних курсів**.'
            echo
            echo '| Банк | Прямий запит | Довірені проксі (за наявності) |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          probe() {
            local target="$1" proxy="${2:-}" label="$3" response status duration
            local args=(--silent --show-error --location --max-redirs 3 \
              --connect-timeout 6 --max-time 12 \
              --proto '=https' --proto-redir '=https' \
              --output /dev/null --write-out '%{http_code} %{time_total}' \
              --user-agent 'NBU-Rate/1.0 (public currency-rate diagnostics)')
            if [ -n "$proxy" ]; then
              # TLS-перевірка сертифіката цільового банку НЕ вимикається.
              args+=(--proxy "$proxy")
            fi
            if response=$(curl "${args[@]}" "$target" 2>/dev/null); then
              read -r status duration <<< "$response"
              printf '%s: HTTP %s, %ss' "$label" "$status" "$duration"
            else
              printf '%s: мережева помилка/таймаут' "$label"
            fi
          }

          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            name="${names[$i]}"
            direct="$(probe "$url" '' 'напряму')"
            via='не налаштовано'
            if [ "${#proxy_list[@]}" -gt 0 ]; then
              via=''
              for p in "${!proxy_list[@]}"; do
                test_result="$(probe "$url" "${proxy_list[$p]}" "проксі $((p+1))")"
                if [ -z "$via" ]; then via="$test_result"; else via="$via; $test_result"; fi
              done
            fi
            echo "$name — $direct; $via"
            printf '| %s | %s | %s |\n' "$name" "$direct" "$via" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo 'Якщо проксі стабільно дає HTTP 200, а прямий запит — HTTP 403, це свідчить про залежність доступу від мережі/IP. Перед інтеграцією в бот перевірте умови використання та достовірність самих даних.'
          } >> "$GITHUB_STEP_SUMMARY"
